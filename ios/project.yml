# Proiectul Xcode se generează din acest fișier: în folderul ios/, rulați `xcodegen` (vedeți README.md).
# Agenda.xcodeproj nu se păstrează în repo; se regenerează după fiecare `git pull`.
name: Agenda
options:
  bundleIdPrefix: ro.cucuta
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""          # se alege în Xcode: Signing & Capabilities → Team
targets:
  Agenda:
    type: application
    platform: iOS
    sources:
      - Agenda
      - Shared
    info:
      path: Agenda/Info.plist
      properties:
        CFBundleDisplayName: Agenda
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # aplicația web are voie la service worker (funcționare fără internet) doar pe domeniile declarate aici
        WKAppBoundDomains:
          - blackfire1894.github.io
        NSLocationWhenInUseUsageDescription: "Coordonatele GPS ale construcțiilor se citesc doar când apăsați „Completează coordonatele”."
        CFBundleURLTypes:
          - CFBundleURLName: ro.cucuta.agenda
            CFBundleURLSchemes:
              - agenda
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: Agenda/Agenda.entitlements
      properties:
        com.apple.security.application-groups:
          - group.ro.cucuta.agenda
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ro.cucuta.agenda
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: AgendaWidget
  AgendaWidget:
    type: app-extension
    platform: iOS
    sources:
      - AgendaWidget
      - Shared
    info:
      path: AgendaWidget/Info.plist
      properties:
        CFBundleDisplayName: Agenda
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: AgendaWidget/AgendaWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.ro.cucuta.agenda
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ro.cucuta.agenda.widget

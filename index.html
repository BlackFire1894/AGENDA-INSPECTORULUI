<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Agenda inspectorului</title>
  <meta name="description" content="Agenda de teren a inspectorului de prevenire: controale, acte, nereguli, amenzi și termene.">
  <meta name="theme-color" content="#16213a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Agenda">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <script>
    // Mărimea textului se aplică înainte de afișare, ca să nu „sară” pagina la pornire.
    try { var f = localStorage.getItem('agenda-font'); if (f === 'mic' || f === 'mediu') document.documentElement.dataset.font = f; } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <img src="icons/icon.svg" alt="" width="48" height="48">
        <div><b>Agenda</b><span>inspectorului</span></div>
      </div>
      <div class="side-clock">
        <span class="side-time" data-clock>--:--</span>
        <span class="side-date" data-clock-date></span>
      </div>
      <button class="btn btn-primary btn-xl btn-block" data-act="new-control">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        Control nou
      </button>
      <nav class="side-nav">
        <a href="#/panou" data-nav="panou">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>
          <span>Panou</span><i class="nav-badge red" data-badge="panou" hidden></i></a>
        <a href="#/obiective" data-nav="obiective">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v16M16 9h2a2 2 0 0 1 2 2v10M2 21h20M8 7h4M8 11h4M8 15h4"/></svg>
          <span>Obiective</span></a>
        <a href="#/calendar" data-nav="calendar">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="17" rx="2.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg>
          <span>Calendar</span></a>
        <a href="#/istoric" data-nav="istoric">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1L3.5 8.5"/><path d="M3.5 3.5v5h5M12 7.5V12l3 2"/></svg>
          <span>Istoric</span><i class="nav-badge" data-badge="istoric" hidden></i></a>
      </nav>
      <button class="side-backup" data-act="backup-export" data-backup-btn>
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M4 20h16"/></svg>
        <span><b>Backup rapid</b><small data-backup-age></small></span>
      </button>
      <a class="side-settings" href="#/setari" data-nav="setari">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg>
        <span>Setări și backup</span></a>
    </aside>

    <main id="main" class="main" tabindex="-1"></main>

    <nav class="tabbar">
      <a href="#/panou" data-nav="panou">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>
        <span>Panou</span><i class="nav-badge red" data-badge="panou" hidden></i></a>
      <a href="#/obiective" data-nav="obiective">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v16M16 9h2a2 2 0 0 1 2 2v10M2 21h20M8 7h4M8 11h4M8 15h4"/></svg>
        <span>Obiective</span></a>
      <button class="tab-new" data-act="new-control" aria-label="Control nou">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <a href="#/calendar" data-nav="calendar">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="17" rx="2.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg>
        <span>Calendar</span></a>
      <a href="#/istoric" data-nav="istoric">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1L3.5 8.5"/><path d="M3.5 3.5v5h5M12 7.5V12l3 2"/></svg>
        <span>Istoric</span><i class="nav-badge" data-badge="istoric" hidden></i></a>
      <a href="#/setari" data-nav="setari">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg>
        <span>Setări</span></a>
    </nav>
  </div>

  <div id="update-bar" class="update-bar" role="status" hidden>
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"/></svg>
    <span><b>Versiune nouă disponibilă.</b> Datele tale rămân neatinse.</span>
    <button class="btn btn-lg" data-act="apply-update">Actualizează</button>
  </div>
  <div id="modal-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript><p style="padding:24px;font-size:20px">Aplicația are nevoie de JavaScript activat.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
